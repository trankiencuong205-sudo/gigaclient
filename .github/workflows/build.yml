name: Build GIGA Client
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        run: |
          echo "Checking project files..."
          ls -la
          test -f build.gradle || test -f build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Build GIGA
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GIGA-Client-JAR
          path: build/libs/*.jar
          if-no-files-found: error
