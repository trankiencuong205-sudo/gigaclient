name: Build GIGA Client
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o giga-client-clean-project.zip -d extracted
          find extracted -name build.gradle -print
          test -f extracted/giga-client-fixed/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GIGA
        working-directory: extracted/giga-client-fixed
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GIGA-Client-JAR
          path: extracted/giga-client-fixed/build/libs/*.jar
          if-no-files-found: error
